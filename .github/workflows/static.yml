# GitHub Pages に静的コンテンツをデプロイするワークフロー
name: Deploy static content to Pages

on:
  # デフォルトブランチへのプッシュ時に実行
  push:
    branches: ["main", "claude/create-beauty-lp-didrl"]

  # Actions タブから手動実行を許可
  workflow_dispatch:

# GITHUB_TOKEN の権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを1つに制限
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ルートディレクトリをアップロード
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
